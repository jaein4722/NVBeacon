name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Shared core (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test platform-independent core
        run: swift test --package-path Shared/NVBeaconCore --build-system native

  macos:
    name: macOS integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "Xcode 26 was not found." >&2
            exit 1
          fi
          selected="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
      - name: Test app and process lifecycle
        run: swift test --build-system native
      - name: Test shared core
        run: swift test --package-path Shared/NVBeaconCore --build-system native
      - name: Test server transfer
        run: swift test --package-path Shared/NVBeaconTransfer --build-system native

  windows:
    name: Windows client
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # v0.5.1. The toolchain must match the tag pinned in Windows/scripts/generate-notices.ps1.
      - name: Install Swift 6.2.4
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: ./Windows/scripts/fetch-webview2.ps1
      - name: Test Windows client
        run: swift test --package-path Windows
      - name: Check bundled license notices
        shell: pwsh
        run: ./Windows/scripts/generate-notices.ps1 -Check
