name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run of the Windows installer build: it uploads the installer as a
  # workflow artifact and publishes nothing. The macOS job does not run.
  workflow_dispatch:
    inputs:
      version:
        description: Windows version to build, such as 1.0.0 or 1.0.0-beta.2 (nothing is published)
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)

          if [ ${#candidates[@]} -gt 0 ]; then
            IFS=$'\n' sorted=($(printf '%s\n' "${candidates[@]}" | sort -V))
            selected="${sorted[${#sorted[@]}-1]}"
            echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected Xcode: $selected"
            exit 0
          fi

          current_version="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          if [[ "$current_version" == 26.* ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
            echo "Using default Xcode.app ($current_version)"
            exit 0
          fi

          echo "No Xcode 26 installation found on runner." >&2
          ls -1 /Applications | grep '^Xcode' || true
          exit 1

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Resolve Developer ID identity
        run: |
          CODESIGN_IDENTITY="$(security find-identity -v -p codesigning | awk -F '\"' '/Developer ID Application:/ { print $2; exit }')"

          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "No Developer ID Application identity found after importing the certificate." >&2
            security find-identity -v -p codesigning || true
            exit 1
          fi

          echo "Resolved code signing identity: $CODESIGN_IDENTITY"
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]]; then
            if [[ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
              echo "APP_STORE_CONNECT_API_KEY_ID secret is required with APP_STORE_CONNECT_API_KEY_BASE64." >&2
              exit 1
            fi
            if [[ -z "${APP_STORE_CONNECT_API_ISSUER_ID:-}" ]]; then
              echo "APP_STORE_CONNECT_API_ISSUER_ID secret is required with APP_STORE_CONNECT_API_KEY_BASE64." >&2
              exit 1
            fi

            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

            xcrun notarytool store-credentials "NVBeaconNotary" \
              --key "$API_KEY_PATH" \
              --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_API_ISSUER_ID"
            exit 0
          fi

          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "APPLE_ID secret is required for notarization when API key secrets are not configured." >&2
            exit 1
          fi
          if [[ -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "APPLE_TEAM_ID secret is required for notarization when API key secrets are not configured." >&2
            exit 1
          fi
          if [[ -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "APPLE_APP_PASSWORD secret is required for notarization when API key secrets are not configured." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "NVBeaconNotary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Derive version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "CHANGELOG_NOTES_PATH=${RUNNER_TEMP}/changelog-notes.md" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=${RUNNER_TEMP}/appcast.xml" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=NVBeacon ${GITHUB_REF_NAME#v}: macOS menu bar app for remote NVIDIA GPU monitoring over SSH" >> "$GITHUB_ENV"

      - name: Extract release notes from changelog
        run: |
          python3 ./scripts/extract_release_notes.py \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --output "$CHANGELOG_NOTES_PATH"

      - name: Prepare public release notes
        run: |
          {
            printf '%s\n\n' 'NVBeacon is a native macOS menu bar app for monitoring remote NVIDIA GPU servers over SSH with `nvidia-smi`, process exit alerts, and GPU idle notifications.'
            cat "$CHANGELOG_NOTES_PATH"
          } > "$RELEASE_NOTES_PATH"

      - name: Build DMG artifact
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "SPARKLE_PUBLIC_ED_KEY secret is required for secure Sparkle updates." >&2
            exit 1
          fi

          chmod +x ./scripts/package_app.sh
          VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            CODESIGN_IDENTITY="$CODESIGN_IDENTITY" \
            NOTARIZE=1 \
            KEYCHAIN_PROFILE="NVBeaconNotary" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            ./scripts/package_app.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVBeacon-${{ env.VERSION }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.dmg)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No DMG artifact found in dist/." >&2
            exit 1
          fi

          # A copy with a fixed name keeps
          # https://github.com/<repo>/releases/latest/download/NVBeacon.dmg
          # pointing at the newest build. Sparkle and Homebrew keep using the
          # versioned DMG.
          versioned_dmg="dist/NVBeacon-${VERSION}.dmg"
          if [ ! -f "$versioned_dmg" ]; then
            echo "Expected $versioned_dmg for the fixed-name download copy." >&2
            exit 1
          fi
          stable_dmg="${RUNNER_TEMP}/NVBeacon.dmg"
          cp "$versioned_dmg" "$stable_dmg"
          assets+=("$stable_dmg")

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

      - name: Generate signed appcast feed
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "SPARKLE_PRIVATE_ED_KEY secret is required for secure Sparkle updates." >&2
            exit 1
          fi

          APPCAST_WORKDIR="${RUNNER_TEMP}/appcast-workdir"
          rm -rf "$APPCAST_WORKDIR"
          mkdir -p "$APPCAST_WORKDIR"

          cp "dist/NVBeacon-${VERSION}.dmg" "$APPCAST_WORKDIR/"
          cp "$RELEASE_NOTES_PATH" "$APPCAST_WORKDIR/NVBeacon-${VERSION}.md"

          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${{ github.repository }}" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            --embed-release-notes \
            --maximum-versions 1 \
            -o "$APPCAST_PATH" \
            "$APPCAST_WORKDIR"

      - name: Publish appcast branch
        env:
          REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          APPCAST_REPO="${RUNNER_TEMP}/appcast-repo"
          rm -rf "$APPCAST_REPO"

          if git clone --depth 1 --branch appcast "$REPOSITORY_URL" "$APPCAST_REPO"; then
            :
          else
            git clone --depth 1 "$REPOSITORY_URL" "$APPCAST_REPO"
            cd "$APPCAST_REPO"
            git switch --orphan appcast
          fi

          cd "$APPCAST_REPO"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$APPCAST_PATH" appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml

          if git diff --cached --quiet; then
            echo "Appcast is already up to date."
            exit 0
          fi

          git commit -m "Update appcast for $VERSION"
          git push origin HEAD:appcast --force

      - name: Dispatch Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Skipping homebrew-tap sync because HOMEBREW_TAP_TOKEN is not configured."
            exit 0
          fi

          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/NVBeacon-${VERSION}.dmg"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/jaein4722/homebrew-tap/dispatches" \
            -f event_type='nvbeacon_release_published' \
            -f client_payload[version]="$VERSION" \
            -f client_payload[tag]="$GITHUB_REF_NAME" \
            -f client_payload[dmg_url]="$DMG_URL"

  # Windows ships from 1.0.0 on, in the same release as macOS. Tags before
  # 1.0.0 (v0.*) stay macOS-only and skip both Windows jobs.
  build-windows:
    name: Build Windows installer
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref_name, 'v0.'))
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.version.outputs.installer }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:DISPATCH_VERSION.Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') { throw "Version must look like 1.2.3 or 1.2.3-beta.1, got '$version'." }
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^(\d+)\.\d+\.\d+$') { throw "Release tags with a Windows build must look like v1.2.3, got '$env:GITHUB_REF_NAME'." }
            if ([int]$Matches[1] -lt 1) { throw "Windows releases start at 1.0.0, got '$version'." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=NVBeacon-$version-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      # Same toolchain as the "Windows client" job in tests.yml (v0.5.1). It must
      # match the tag pinned in Windows/scripts/generate-notices.ps1.
      - name: Install Swift 6.2.4
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: ./Windows/scripts/fetch-webview2.ps1

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed." }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found at $iscc after installing." }
          "Using $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Windows\scripts\package.ps1 -Version $env:VERSION -Installer -NoZip
          if ($LASTEXITCODE -ne 0) { throw "package.ps1 failed." }

      - name: Check installer
        shell: pwsh
        env:
          INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          $setup = Join-Path dist $env:INSTALLER
          if (-not (Test-Path $setup)) { throw "Expected $setup from package.ps1." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          "``$env:INSTALLER`` ($size MB), SHA-256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVBeacon-${{ steps.version.outputs.version }}-windows-installer
          path: dist/${{ steps.version.outputs.installer }}
          if-no-files-found: error

  # Runs after the macOS job, which creates the release, so the installer is
  # only added to that release. It never creates or edits a release.
  publish-windows:
    name: Upload Windows installer to the release
    needs: [build-and-release, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: NVBeacon-${{ needs.build-windows.outputs.version }}-windows-installer
          path: dist

      - name: Upload installer to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALLER: ${{ needs.build-windows.outputs.installer }}
        run: |
          if [ ! -f "dist/$INSTALLER" ]; then
            echo "Expected dist/$INSTALLER in the workflow artifact." >&2
            exit 1
          fi

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null; then
            echo "Release $GITHUB_REF_NAME does not exist; the macOS job creates it." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "dist/$INSTALLER" --clobber
